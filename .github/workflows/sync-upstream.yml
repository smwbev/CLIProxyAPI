name: sync upstream

# Тянет из router-for-me/CLIProxyAPI прежде всего ТЕГИ, и лишь затем — ветку main.
#
# Почему теги важнее ветки: hutch собирает прокси клонированием ПО ТЕГУ
# (`git clone --branch <тег>`), а нужный тег выбирает по списку тегов этого форка.
# Содержимое ветки main на сборку не влияет вообще. Пока теги не приезжали,
# версия в сборке стояла на v7.2.116, хотя апстрим ушёл на v7.2.131.
#
# main синхронизируется обычным merge, а не --ff-only: в форке лежит этот самый
# workflow, то есть ветка заведомо разошлась с апстримом и fast-forward невозможен
# по определению. Неудача на этом шаге не валит job — теги к тому моменту уже
# отправлены, а сборке больше ничего и не нужно.
#
# Остальные workflow апстрима в форке отключены намеренно: они публиковали бы
# релизы и образы от нашего имени. Этот — наш, его отключать не надо.

on:
  schedule:
    # каждый день в 18:00 UTC (01:00 по Бангкоку) — за три часа до ночной
    # пересборки hutch (21:00 UTC).
    #
    # Раньше стояло 20:30, то есть за полчаса. Этого не хватало: GitHub
    # запускает cron с задержкой 1ч40м–2ч30м, и разброс задержек оказался
    # больше запаса — сборка иногда стартовала РАНЬШЕ синхронизации и брала
    # вчерашний тег. Три часа перекрывают разброс с запасом; вдобавок сборка
    # на своей стороне ждёт, если форк всё-таки отстал.
    - cron: '0 18 * * *'
  workflow_dispatch:

# contents: write otnositsya k GITHUB_TOKEN. Dlya tegov ego NE hvataet — sm.
# kommentariy u shaga checkout nizhe.
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Tokenom dlya pusha beretsya SYNC_TOKEN, esli on zadan v sekretah repozitoriya,
      # inache — obychnyy GITHUB_TOKEN. actions/checkout propisyvaet peredannyy
      # token v lokalnyy git-konfig, poetomu oba push nizhe idut pod nim.
      #
      # Zachem otdelnyy token. GITHUB_TOKEN ne mozhet pravit fayly v
      # .github/workflows: takogo klyucha net v spiske permissions, i actions:
      # write ego ne zamenyaet. Ogranichenie namerennoe, chtoby Actions ne
      # perepisyvali sami sebya. Kak tolko apstrim trogaet svoi workflow, teg,
      # kotoryy tyanet za soboy etot kommit, otklonyaetsya s oshibkoy:
      #
      #   ! [remote rejected] v7.3.7 -> v7.3.7 (refusing to allow a GitHub App
      #     to create or update workflow `.github/workflows/release.yaml`
      #     without `workflows` permission)
      #
      # Otklonyaetsya pri etom ne tolko etot teg, no i vse posleduyushchie: 17 i
      # 18.09.2026 fork tak i zastryal na v7.3.6, poka apstrim ushel na v7.3.8.
      # Sborka hutch pri etom ostavalas zelenoy — ona chestno zhdet 20 minut,
      # potom sobiraet to, chto est, i pishet preduprezhdenie, kotoroe nikto
      # ne chitaet. Dve versii propustili imenno tak.
      #
      # SYNC_TOKEN — fine-grained PAT na etot repozitoriy:
      #   Contents: Read and write, Workflows: Read and write, Metadata: Read
      #
      # Poka sekret ne zadan, vyrazhenie daet pustuyu stroku i podstavlyaetsya
      # github.token — povedenie ostaetsya tem zhe, chto i do etoy pravki.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Теги из апстрима
        id: tags
        run: |
          set -eu
          git remote add upstream https://github.com/router-for-me/CLIProxyAPI.git
          git fetch upstream main --tags

          before=$(git tag | wc -l | tr -d ' ')
          git push origin --tags
          after=$(git ls-remote --tags origin | grep -cv '\^{}' || echo 0)

          latest=$(git tag --sort=-v:refname | head -1)
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "тегов локально: $before, в origin после push: $after, последний: $latest"

      - name: Ветка main (не критично)
        continue-on-error: true
        run: |
          set -eu
          behind=$(git rev-list --count HEAD..upstream/main)
          if [ "$behind" -eq 0 ]; then
            echo "main уже свежий"
            exit 0
          fi
          echo "main отстаёт на $behind коммитов, сливаю"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge upstream/main --no-edit
          git push origin main

      - name: Итог
        run: |
          {
            echo "### Синхронизация с апстримом"
            echo ""
            echo "- последний тег: \`${{ steps.tags.outputs.latest }}\`"
            echo "- именно он попадёт в следующую сборку hutch"
          } >> "$GITHUB_STEP_SUMMARY"
