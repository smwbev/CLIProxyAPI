name: sync upstream

# Тянет из router-for-me/CLIProxyAPI прежде всего ТЕГИ, и лишь затем — ветку main.
#
# Почему теги важнее ветки: hutch собирает прокси клонированием ПО ТЕГУ
# (`git clone --branch <тег>`), а нужный тег выбирает по списку тегов этого форка.
# Содержимое ветки main на сборку не влияет вообще. Пока теги не приезжали,
# версия в сборке стояла на v7.2.116, хотя апстрим ушёл на v7.2.131.
#
# main синхронизируется обычным merge, а не --ff-only: в форке лежит этот самый
# workflow, то есть ветка заведомо разошлась с апстримом и fast-forward невозможен
# по определению. Неудача на этом шаге не валит job — теги к тому моменту уже
# отправлены, а сборке больше ничего и не нужно.
#
# Остальные workflow апстрима в форке отключены намеренно: они публиковали бы
# релизы и образы от нашего имени. Этот — наш, его отключать не надо.

on:
  schedule:
    # каждый день в 20:30 UTC (03:30 по Бангкоку) — до ночной пересборки hutch
    - cron: '30 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Теги из апстрима
        id: tags
        run: |
          set -eu
          git remote add upstream https://github.com/router-for-me/CLIProxyAPI.git
          git fetch upstream main --tags

          before=$(git tag | wc -l | tr -d ' ')
          git push origin --tags
          after=$(git ls-remote --tags origin | grep -cv '\^{}' || echo 0)

          latest=$(git tag --sort=-v:refname | head -1)
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "тегов локально: $before, в origin после push: $after, последний: $latest"

      - name: Ветка main (не критично)
        continue-on-error: true
        run: |
          set -eu
          behind=$(git rev-list --count HEAD..upstream/main)
          if [ "$behind" -eq 0 ]; then
            echo "main уже свежий"
            exit 0
          fi
          echo "main отстаёт на $behind коммитов, сливаю"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge upstream/main --no-edit
          git push origin main

      - name: Итог
        run: |
          {
            echo "### Синхронизация с апстримом"
            echo ""
            echo "- последний тег: \`${{ steps.tags.outputs.latest }}\`"
            echo "- именно он попадёт в следующую сборку hutch"
          } >> "$GITHUB_STEP_SUMMARY"
